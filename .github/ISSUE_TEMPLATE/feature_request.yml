name: Feature request
description: Propose an improvement or new capability
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: motivation
    attributes:
      label: Motivation
      description: What problem would this solve, and for whom?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the desired behavior and any alternatives considered.
    validations:
      required: true
  - type: textarea
    id: compatibility
    attributes:
      label: Compatibility and tradeoffs
      description: Note API, dependency, data-format, performance, or migration implications.
